<section id="about" class="who-we-are-section">
  <div class="container who-container">
    <!-- Left Side: Infographic Brochure Mockup -->
    <div class="visual-col" appScrollReveal>
      <div class="brochure-card-wrapper">
        <div class="brochure-glow"></div>
        <div class="brochure-card">
          <img 
            src="assets/images/who-we-are-visual.jpg" 
            alt="Kernel Panic — secure technology and IT infrastructure" 
            class="brochure-image"
            loading="lazy"
          />
        </div>

        <!-- Floating Egyptian Est. Badge -->
        <div class="est-badge">
          <div class="est-tag">{{ ts.t('whoWeAre.badgeText') }}</div>
          <div class="est-motto">{{ ts.t('footer.motto') }}</div>
        </div>
      </div>
    </div>

    <!-- Right Side: Content & Key Capabilities -->
    <div class="content-col" appScrollReveal [revealDelay]="150">
      <span class="section-tag">{{ ts.t('whoWeAre.tag') }}</span>
      <h2 class="section-title who-title">
        {{ ts.t('whoWeAre.title') }}
      </h2>

      <p class="who-paragraph">
        {{ ts.t('whoWeAre.desc1') }}
      </p>

      <p class="who-paragraph secondary">
        {{ ts.t('whoWeAre.desc2') }}
      </p>
    </div>
  </div>
</section>
