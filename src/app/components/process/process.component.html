<section id="process" class="process-section">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header" appScrollReveal>
      <app-section-heading
        [eyebrow]="ts.t('process.tag')"
        [title]="ts.t('process.title')"
        [highlight]="ts.t('process.titleHighlight')"
        [subtitle]="ts.t('process.desc')"
        accent="bracket"
        marker="code"></app-section-heading>
    </div>

    <!-- 4 Step Connected Horizontal Flow -->
    <div class="process-timeline">
      <div class="timeline-line"></div>
      <div class="timeline-line-fill" appScrollReveal [revealThreshold]="0.3"></div>

      <div class="steps-grid">
        <div 
          *ngFor="let step of steps(); let i = index" 
          class="step-item"
          appScrollReveal
          [revealDelay]="i * 120"
        >
          <div class="step-circle-wrapper">
            <div class="step-circle">
              <span class="step-num">{{ step.stepNumber }}</span>
            </div>
          </div>

          <h3 class="step-title">{{ step.title }}</h3>
          <p class="step-desc">{{ step.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
