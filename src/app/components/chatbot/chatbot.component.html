<!-- Floating Chatbot Launcher Button -->
<div class="chatbot-wrapper">
  <!-- Launcher Button -->
  <button 
    class="chatbot-launcher" 
    [class.active]="isOpen"
    (click)="toggleChat()"
    aria-label="Open Kernel Panic AI Assistant"
  >
    <!-- Notification Badge -->
    <span *ngIf="!isOpen && unreadCount > 0" class="chat-badge">{{ unreadCount }}</span>
    
    <!-- Chat Icon when closed -->
    <svg *ngIf="!isOpen" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      <circle cx="9" cy="10" r="1" fill="#FFFFFF"></circle>
      <circle cx="12" cy="10" r="1" fill="#FFFFFF"></circle>
      <circle cx="15" cy="10" r="1" fill="#FFFFFF"></circle>
    </svg>

    <!-- Close Icon when open -->
    <svg *ngIf="isOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

  <!-- Chatbot Window Dialog -->
  <div class="chat-window card-base" [class.open]="isOpen">
    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="bot-avatar">
          <img src="assets/images/kp-logo.png" alt="KP Bot" class="avatar-img" />
          <span class="online-indicator"></span>
        </div>
        <div class="bot-details">
          <div class="bot-name">Kernel Panic Assistant</div>
          <div class="bot-status">
            <span class="status-dot"></span>
            <span>Online | مساعدك الذكي</span>
          </div>
        </div>
      </div>
      
      <button class="chat-close-btn" (click)="toggleChat()" aria-label="Close Chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Messages Container -->
    <div class="chat-messages" #messagesContainer>
      <div 
        *ngFor="let msg of messages" 
        class="message-bubble-wrapper"
        [class.user-message]="msg.sender === 'user'"
        [class.bot-message]="msg.sender === 'bot'"
      >
        <div class="message-content">
          <p>{{ msg.text }}</p>
          <div *ngIf="msg.actionLink" class="msg-action-box">
            <a [href]="msg.actionLink" target="_blank" rel="noopener" class="msg-action-btn">
              {{ msg.actionText }}
            </a>
          </div>
          <span class="message-time">{{ msg.time }}</span>
        </div>
      </div>

      <!-- Live Typing Animation Bubble -->
      <div *ngIf="isTyping" class="message-bubble-wrapper bot-message">
        <div class="message-content typing-box">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>

      <!-- Quick Action Suggestion Chips -->
      <div class="quick-chips" *ngIf="messages.length <= 2">
        <div class="quick-title">اختر استفسارًا سريعًا:</div>
        <div class="chips-list">
          <button *ngFor="let chip of quickSuggestions" class="chip-btn" (click)="handleSuggestion(chip)">
            {{ chip.label }}
          </button>
        </div>
      </div>
    </div>

    <!-- Input Footer -->
    <div class="chat-footer">
      <form (submit)="sendMessage($event)" class="chat-input-form">
        <input 
          type="text" 
          [(ngModel)]="userInput" 
          name="userInput"
          placeholder="اكتب استفسارك هنا... / Ask anything..."
          class="chat-input"
          autocomplete="off"
        />
        <button type="submit" class="chat-send-btn" [disabled]="!userInput.trim()" aria-label="Send Message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
